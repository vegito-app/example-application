name: Vegito Release

permissions:
  id-token: write
  contents: write

on:
  push:
    branches: [main]

jobs:
  pipeline:
    uses: ./.github/workflows/application-pipeline.yml

    strategy:
      matrix:
        environment: [dev]
    with:
      environment: ${{ matrix.environment }}
      project: vegito-local
      docker_registry_mode: dockerhub
      project_docker_repository: vegito-local
      images_to_scan: '["${{ vars.VEGITO_DOCKER_PUBLIC_REPOSITORY }}/vegito-local:example-application-backend"]'
      functional_tests_dir: example-application/tests/output
      has_mobile: true
      android_release_keystore_path: example-application/mobile/android/release-key.keystore
      use_registry_cache: ${{ vars.USE_REGISTRY_CACHE == 'true' }}
      env_bucket_map: |
        dev: vegito-app-dev-github-actions-ci-artifacts

    secrets: inherit
