name: Application Dev Release Build

permissions:
  id-token: write
  contents: write

on:
  push:
    branches: [dev]
jobs:
  build:
    name: Build and Push Images
    uses: vegito-app/local/.github/workflows/build-images.yml@main
    strategy:
      matrix:
        environment: [dev]
    with:
      version: dev-latest
      environment: ${{ matrix.environment }}
      android_release_keystore_path: mobile/android/release-key.keystore
      android_release_keystore_base64_path: mobile/android/release-key.keystore.base64
      android_release_keystore_store_pass_base64_path: mobile/android/release-key.keystore.storepass.base64
      env_bucket_map: |
        dev: vegito-app-dev-github-actions-ci-artifacts
    secrets: inherit

  upload-android-artifacts:
    needs:
      - checkout
    name: Build and Push Images
    uses: ./.github/workflows/upload-android-artifacts.yml
    strategy:
      matrix:
        environment: [dev]
    with:
      version: dev-latest
      environment: dev
    secrets: inherit

  test:
    needs:
      - build
    name: Run Tests
    uses: vegito-app/local/.github/workflows/functional-tests.yml@main
    strategy:
      matrix:
        environment: [dev]
    with:
      version: dev-latest
      environment: ${{ matrix.environment }}
      functional-tests-output-dir: tests/output
      env_bucket_map: |
        dev: vegito-app-dev-github-actions-ci-artifacts
    secrets: inherit
