name: Vegito Application Pipeline

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
        
      project_docker_repository:
        required: false
        type: string
        default: docker-repository-public

      functional_tests_dir:
        required: false
        type: string
        default: tests/robot/output

      images_to_scan:
        required: false
        type: string
        default: '["application-backend"]'

      release_bucket_prefix:
        required: false
        type: string
        default: ${{ github.repository }}

      use_registry_cache:
        required: false
        type: boolean
        default: false

      has_mobile:
        required: false
        type: boolean
        default: true

      env_bucket_map:
        description: "YAML mapping of environment to release bucket"
        required: false
        type: string
        default: |
          dev: vegito-app-dev-github-actions-ci-artifacts-private
          staging: vegito-app-staging-github-actions-ci-artifacts-private
          prod: vegito-app-prod-github-actions-ci-artifacts-private

      docker_registry_mode:
        required: false
        type: string
        default: "gcr"

      environment:
        required: false
        type: string
        default: prod

      android_release_keystore_path:
        required: false
        type: string
        default: .android.release-key.keystore

    outputs:
      version:
        description: "The version generated for this release"
        value: ${{ jobs.version-changelog.outputs.version }}

permissions:
  id-token: write
  contents: write

env:
  TEST_ENV: ${{ inputs.environment }}

jobs:
  version-changelog:
    uses: vegito-app/local/.github/workflows/version-changelog.yml@v1.24.0
    secrets: inherit

  version-metadata:
    needs: version-changelog
    strategy:
      matrix:
        # environment: [dev, staging, prod]
        environment: ${{ inputs.environment }}
    uses: vegito-app/local/.github/workflows/version-metadata.yml@v1.24.0

    with:
      environment: ${{ matrix.environment }}
      version: ${{ needs.version-changelog.outputs.version }}
      changelog: ${{ needs.version-changelog.outputs.changelog }}
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}

    secrets: inherit

  build:
    name: Build Images
    needs: version-changelog
    uses: vegito-app/local/.github/workflows/build-images.yml@v1.24.0

    with:
      version: ${{ needs.version-changelog.outputs.version }}
      environment: ${{ inputs.environment }}
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}
      android_release_keystore_path: ${{ inputs.android_release_keystore_path }}
      use_registry_cache: ${{ inputs.use_registry_cache }}

    secrets: 
      GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
      GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_EMAIL: ${{ vars.WORKLOAD_IDENTITY_POOL_ID }}@${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}.iam.gserviceaccount.com
      GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER: projects/${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.WORKLOAD_IDENTITY_POOL_ID }}/providers/${{ vars.WORKLOAD_IDENTITY_PROVIDER_ID }}
      
  tests:
    name: Run Functional Tests
    needs: [build, version-changelog]
    uses: vegito-app/local/.github/workflows/functional-tests.yml@v1.24.0

    with:
      version: ${{ needs.version-changelog.outputs.version }}
      environment: ${{ inputs.environment }}
      functional-tests-output-dir: ${{ inputs.functional_tests_dir }}
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}
      has_mobile: ${{ inputs.has_mobile }}

    secrets: inherit

  trivy:
    name: Security Scan (Trivy)
    needs: [version-changelog, build]

    strategy:
      matrix:
        image: ${{ fromJson(inputs.images_to_scan) }}
    uses: vegito-app/local/.github/workflows/trivy-scan-image-ref.yml@v1.24.0

    with:
      environment: ${{ inputs.environment }}
      docker_registry_mode: ${{ inputs.project_docker_repository }}/${{ inputs.project }}:${{ matrix.image }}-${{ needs.version-changelog.outputs.version }}
      project: ${{ inputs.project }}
      project_docker_repository: ${{ inputs.project_docker_repository }}
      image_name: ${{ matrix.image }}
      severity: CRITICAL,HIGH
      exit-code: "1"
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}
      version: ${{ needs.version-changelog.outputs.version }}

    secrets: inherit

  release:
    name: Create Consolidated Release Notes
    needs: [tests, trivy, version-changelog]
    uses: vegito-app/local/.github/workflows/application-release-metadata.yml@v1.24.0

    with:
      environment: ${{ inputs.environment }}
      version: ${{ needs.version-changelog.outputs.version }}
      changelog: ${{ needs.version-changelog.outputs.changelog }}
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}

    secrets: inherit

  finalize:
    name: Finalize Release
    needs: [release, version-changelog]
    uses: vegito-app/local/.github/workflows/version-finalize.yml@v1.24.0

    with:
      environment: ${{ inputs.environment }}
      env_bucket_map: ${{ inputs.env_bucket_map }}
      release_bucket_prefix: ${{ inputs.release_bucket_prefix }}
      version: ${{ needs.version-changelog.outputs.version }}
      changelog: ${{ needs.version-changelog.outputs.changelog }}
      commit_sha: ${{ needs.version-changelog.outputs.commit_sha }}

    secrets:
      GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.RELEASE_READER_GOOGLE_CLOUD_PROJECT_ID }}
      GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.RELEASE_READER_GOOGLE_CLOUD_WORKLOAD_IDENTITY_PROVIDER }}
      GOOGLE_CLOUD_SERVICE_ACCOUNT_EMAIL: ${{ secrets.RELEASE_READER_GOOGLE_CLOUD_SERVICE_ACCOUNT_EMAIL }}
