name: Vegito Release

permissions:
  id-token: write
  contents: write

on:
  push:
    branches: [main]

jobs:
  pipeline:
    uses: ./.github/workflows/application-pipeline.yml

    with:
      environment: dev
      functional_tests_dir: tests/output
      images_to_scan: '["${{ vars.VEGITO_DOCKER_PUBLIC_REPOSITORY }}/example-application:backend"]'
      project: example-application
      docker_registry_mode: dockerhub
      project_docker_repository: example-application
      docker_public_repository: ${{ vars.VEGITO_DOCKER_PUBLIC_REPOSITORY }}
      android_release_keystore_path: mobile/android/release-key.keystore
      use_registry_cache: ${{ vars.USE_REGISTRY_CACHE == 'true' }}
      env_bucket_map: |
        dev: vegito-app-dev-github-actions-ci-artifacts
        staging: vegito-app-staging-github-actions-ci-artifacts
        prod: vegito-app-prod-github-actions-ci-artifacts

    secrets: inherit
