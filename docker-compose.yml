volumes:
  firebase-emulators-cache:
  clarinet_var_lib_docker:
services:
  dev:
    restart: unless-stopped
    tty: true
    image: ${LOCAL_BUILDER_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:builder-latest}
    env_file:
      - .env
    environment:
      LOCAL_WORKSPACE: ${PWD}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-vegito-local}
      GCLOUD: gcloud
      VEGITO_DOCKER_REGISTRIES: ${VEGITO_DOCKER_REGISTRIES}
      VEGITO_DOCKER_BUILD_ENABLE_LOCAL_CACHE: ${VEGITO_DOCKER_BUILD_ENABLE_LOCAL_CACHE:-false}
      VEGITO_DOCKERHUB_PAT: ${VEGITO_DOCKERHUB_PAT}
      VEGITO_DOCKERHUB_USERNAME: ${VEGITO_DOCKERHUB_USERNAME}
    volumes:
      - ${PWD}:${PWD}:cached
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
      - /lib/modules:/lib/modules:ro
    privileged: true
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 5s
      retries: 3
    working_dir: ${PWD}

  firebase-emulators:
    restart: unless-stopped
    tty: true
    image: ${LOCAL_FIREBASE_EMULATORS_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:firebase-emulators-latest}
    env_file:
      - .env
    environment:
      LOCAL_WORKSPACE: ${PWD}
      FIREBASE_AUTH_EMULATOR_HOST: http://localhost:9099
      FIREBASE_PUBSUB_EMULATOR_HOST: http://localhost:8085
      FIRESTORE_EMULATOR_HOST: http://localhost:8090
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      LOCAL_FIREBASE_EMULATORS_SERVICES: ${LOCAL_FIREBASE_EMULATORS_SERVICES}
      CHOKIDAR_USEPOLLING: "true"
      INFRA_ENV: ${INFRA_ENV}
    volumes:
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
    working_dir: ${PWD}

  clarinet-devnet:
    restart: unless-stopped
    tty: true
    privileged: true
    image: ${LOCAL_CLARINET_DEVNET_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:clarinet-latest}
    env_file:
      - .env
    environment:
      LOCAL_WORKSPACE: ${PWD}
      DOCKER_HOST: "unix:///run/user/1000/docker.sock"
    volumes:
      - /dev:/dev
      - /lib/modules:/lib/modules
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    working_dir: ${PWD}

  android-studio:
    restart: unless-stopped
    tty: true
    cap_add:
      - SYS_ADMIN
      - SYS_NICE
    image: ${LOCAL_ANDROID_STUDIO_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:android-studio-latest}
    env_file:
      - .env
    environment:
      LOCAL_WORKSPACE: ${PWD}
      LOCAL_ANDROID_DEBUG_APK_PATH: ${LOCAL_ANDROID_DEBUG_APK_PATH:-mobile/build/app/outputs/flutter-apk/app-debug.apk}
      DISPLAY_RESOLUTION: "${DISPLAY_RESOLUTION:-1920x1080}"
      XPRA_ARGS: ${XPRA_ARGS:-}
      CHROME_LOG_FILE: /tmp/chrome_debug.log
      LOCAL_ANDROID_EMULATOR_AVD_ON_START: ${LOCAL_ANDROID_EMULATOR_AVD_ON_START:-false}
      # LOCAL_ANDROID_EMULATOR_AVD_HEADLESS_ARGS: ${LOCAL_ANDROID_EMULATOR_AVD_HEADLESS_ARGS:-"-no-window"}
      LOCAL_ANDROID_EMULATOR_DATA: ${LOCAL_ANDROID_EMULATOR_DATA:-${PWD}/example-application/tests/mobile_images}
      LOCAL_ANDROID_STUDIO_LOG_LEVEL: DEBUG
      LOCAL_ANDROID_STUDIO_CONTAINER_CACHE: ${LOCAL_ANDROID_STUDIO_CONTAINER_CACHE:-${LOCAL_ANDROID_STUDIO_DIR:-${PWD}/android/studio}/.containers/android-studio}
      LOCAL_ANDROID_STUDIO_CONTAINER_INSTALL: ${LOCAL_ANDROID_STUDIO_CONTAINER_INSTALL:-true}
      LOCAL_ANDROID_STUDIO_ON_START: ${LOCAL_ANDROID_STUDIO_ON_START:-true}
      LOCAL_ANDROID_STUDIO_DIR: ${LOCAL_ANDROID_STUDIO_DIR:-${PWD}/android/studio}

      LOCAL_ANDROID_EMULATOR_AVD_NAME: ${VEGITO_MOBILE_ANDROID_AVD_NAME:-Pixel_8_Intel}
      LOCAL_ANDROID_PACKAGE_NAME: ${VEGITO_MOBILE_ANDROID_PACKAGE_NAME:-dev.vegito.app.android}

      LOCAL_ANDROID_CONTAINER_NAME: ${LOCAL_ANDROID_CONTAINER_NAME:-android-studio}
      LOCAL_ANDROID_CONTAINER_EXEC: ""

      DISPLAY: ${LOCAL_ANDROID_STUDIO_XPRA_DISPLAY:-:1}
      WAYLAND_DISPLAY_NAME: $LOCAL_ANDROID_STUDIO_XPRA_WAYLAND_DISPLAY_NAME:-wayland-1}

    privileged: true
    volumes:
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
    group_add:
      - render
      - ${KVM_GID}
    devices:
      - /dev/kvm
      - /dev/dri
    working_dir: ${LOCAL_ANDROID_STUDIO_DIR:-${PWD}/android/studio}

    # command: |
    #   bash -c '
    #   set -euxo pipefail
    #   android-studio-container-start.sh
    #   '
  vault-dev:
    restart: unless-stopped
    image: ${LOCAL_VAULT_DEV_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:vault-dev-latest}
    cap_add:
      - IPC_LOCK
    environment:
      LOCAL_WORKSPACE: ${LOCAL_WORKSPACE:-${PWD}}
      VAULT_DATA: ${VAULT_DATA:-${PWD}/vault/file}
      VAULT_CONFIG: ${VAULT_CONFIG:-${PWD}/vault/config}
      VAULT_AUDIT: ${VAULT_AUDIT:-${PWD}/vault/audit}
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_AUDIT_INIT: ${LOCAL_VAULT_AUDIT_INIT:-true}
    volumes:
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
    working_dir: ${PWD}/application
    tty: true
  robotframework:
    restart: unless-stopped
    tty: true
    image: ${LOCAL_ROBOTFRAMEWORK_TESTS_IMAGE:-${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:robotframework-latest}
    environment:
      VEGITO_EXAMPLE_APPLICATION_BACKEND_URL_DEBUG: http://devcontainer:8888
      LOCAL_WORKSPACE: ${PWD}
      LOCAL_ROBOTFRAMEWORK_TESTS_DIR: ${PWD}/example-application/tests
      STORAGE_EMULATOR_HOST: http://${FIREBASE_STORAGE_EMULATOR_HOST:-firebase-emulators:9199}

    env_file:
      - .env
    volumes:
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
    working_dir: ${PWD}/example-application/tests
    command: |
      bash -c '
      set -eu
      sleep infinity
      '

  nestor:
    restart: unless-stopped
    tty: true
    privileged: true
    image: ${VEGITO_LOCAL_PUBLIC_IMAGES_BASE_NAME}:nestor-latest
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      LOCAL_WORKSPACE: ${PWD}
      DOCKER_HOST: "unix:///run/user/1000/docker.sock"
      ROOT_DOCKER_HOST: "tcp://dev:2375"
      LOCAL_NESTOR_OLLAMA: ollama
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ai-nestor:11434}
      AI_WORKSPACES: ${AI_WORKSPACES:-/workspaces/ai}
      JITSI_PUBLIC_URL: ${JITSI_PUBLIC_URL:-https://meet.vegito.app}
    extra_hosts:
      - "meet.vegito.app:10.5.5.7"
    # dns:
    #   - ${VEGITO_DNS_SERVER:-10.5.5.7}
    working_dir: ${PWD}
    volumes:
      - /dev:/dev
      - /lib/modules:/lib/modules
      - ${LOCAL_WORKSPACE:-${PWD}}:${PWD}:cached
      # Shared volumes for Ollama models and cache
      - ${AI_WORKSPACES:-/workspaces/ai}:/workspaces/ai:rw
